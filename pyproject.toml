[project]
name = "jfrog-secret-rotator-lambda"
version = "0.0.0"
description = "GCP Cloud Function that rotates a JFrog access token in Secret Manager"
requires-python = ">=3.11"
# Runtime deps for the lambda Function live in secret-rotator/requirements.txt
# (deployed as-is by aws / Terraform). This project metadata is for local
# and CI tooling only.
dependencies = []

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0.0",
]

[dependency-groups]
# Mirror of [project.optional-dependencies].dev so `uv sync` installs lint
# tools by default (uv's default group) while `pip install -e ".[dev]"` still
# works as documented in CONTRIBUTING.md.
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 120

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear
select = ["E", "W", "F", "I", "UP", "B"]
